[package]
name = "omninote-workspace-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[dependencies]
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-casefold = "0.2"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"
