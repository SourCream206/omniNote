[package]
name = "omninote-tauri"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "omninote_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
omninote-workspace-core = { path = "../../crates/workspace-core" }
serde_json = "1"
uuid = "1"
url = "2"
