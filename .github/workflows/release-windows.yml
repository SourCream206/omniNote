name: Release Tauri desktop app

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: windows-latest
            bundles: nsis
          - runner: ubuntu-22.04
            bundles: appimage,deb,rpm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'tauri-v2/src-tauri -> target'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - name: Check tag and Tauri version
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./tauri-v2/src-tauri/tauri.conf.json").version')"
      - run: npm ci
      - run: npm ci --prefix tauri-v2
      - run: npm test
      - run: cargo test --manifest-path crates/workspace-core/Cargo.toml --locked
      - run: cargo test --manifest-path tauri-v2/src-tauri/Cargo.toml --lib --locked
      - name: Require updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'TAURI_SIGNING_PRIVATE_KEY is missing'; exit 1; }
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: tauri-v2
          tagName: ${{ github.ref_name }}
          releaseName: omniNote ${{ github.ref_name }}
          releaseDraft: true
          generateReleaseNotes: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles ${{ matrix.bundles }}

  publish:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - name: Verify signed updater assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/assets.txt"
          grep -Fx 'latest.json' "$RUNNER_TEMP/assets.txt"
          grep -Eq '\.exe$' "$RUNNER_TEMP/assets.txt"
          grep -Eq '\.exe\.sig$' "$RUNNER_TEMP/assets.txt"
          grep -Eq '\.AppImage$' "$RUNNER_TEMP/assets.txt"
          gh release download "$GITHUB_REF_NAME" --pattern latest.json --dir "$RUNNER_TEMP"
          jq -e '(.platforms | keys | any(startswith("windows"))) and (.platforms | keys | any(startswith("linux")))' "$RUNNER_TEMP/latest.json"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
